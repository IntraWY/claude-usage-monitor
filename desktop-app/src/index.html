<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"
    />
    <title>AI Usage Monitor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <strong>AI Usage · ♡</strong
      ><button id="pin" aria-label="ปักหน้าต่าง" aria-pressed="false">📌</button
      ><button id="close" aria-label="ออกจากโปรแกรม">×</button>
    </header>
    <nav>
      <button id="compact">Compact</button><button id="detail">Detail</button
      ><span class="spacer"></span><button id="used">ใช้แล้ว</button
      ><button id="remaining">เหลือ</button>
    </nav>
    <main id="cards"></main>
    <footer>
      <label
        >อัปเดตทุก
        <input id="interval" type="number" min="1" max="1440" value="5" />
        นาที</label
      ><button id="refresh">↻ รีเฟรช</button><button id="codex">+ Codex</button
      ><button id="claude">+ Claude</button>
    </footer>
    <p class="note">โลโก้แบรนด์ + มาสคอต · แสดงข้อมูลจากบัญชีที่เชื่อมต่อ</p>
    <div id="notice" role="status"></div>
    <script src="renderer.js"></script>
  </body>
</html>
