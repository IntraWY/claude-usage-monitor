<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Usage · Design prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceef0;color:#30343b;font:14px system-ui,sans-serif;padding:32px 12px}button,input{font:inherit}button{cursor:pointer;background:white;border:1px solid #dddfe4;border-radius:10px;padding:8px 12px;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #aebfe9}button[aria-pressed=true]{background:#e9eef9;border-color:#b0bee1}.window{max-width:760px;margin:auto;background:#fafbfc;border:1px solid #d9dde3;border-radius:22px;box-shadow:0 20px 65px #27334418;overflow:hidden}.compact{max-width:470px}header,nav,footer{padding:16px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{background:white;border-bottom:1px solid #eaecf0}header strong{flex:1}.badge{font-size:11px;background:#fff2dc;color:#76551c;padding:5px 8px;border-radius:8px}.note{padding:0 20px;color:#737b88;font-size:12px}nav{padding-top:8px;padding-bottom:8px}.cards{padding:10px 20px;display:grid;gap:12px}.card{border:1px solid #e0e4e9;border-radius:16px;background:white;padding:16px}.account{display:flex;gap:10px;align-items:center;margin-bottom:14px}.brand{width:34px;height:34px;border-radius:10px;background:#eef0f4;display:grid;place-items:center;font-weight:bold}.identity{flex:1;min-width:0}.identity b,.identity small{display:block;overflow-wrap:anywhere}small{color:#77808e;font-size:11px}.mascot{width:37px;height:32px;background:#e5eee9;border-radius:14px 14px 10px 10px;display:grid;place-items:center;color:#53715f;font-size:12px}.claude .mascot{background:#f5e8df;color:#957058}.quotas{display:grid;gap:13px}.quota-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}.track{height:6px;background:#eff1f4;border-radius:6px;overflow:hidden}.fill{height:100%;background:#96b5a6}.claude .fill{background:#d6ae92}.reset{font-size:11px;color:#79808c;margin-top:4px}.details{margin-top:14px;padding-top:10px;border-top:1px dashed #e1e4e8}.compact .details{display:none}label{display:block;margin:9px 0;font-size:12px}input[type=number]{width:66px;border:1px solid #dce0e6;border-radius:7px;padding:5px;background:white}.error{background:#fff7ed;color:#956c39;border-radius:9px;padding:10px;font-size:12px}footer{font-size:12px;color:#737b88;border-top:1px solid #e6e9ed}#notice{padding:0 20px 16px;font-size:12px;color:#665a92;min-height:32px}.catalog{font-size:12px;color:#737b88;margin-top:10px}.muted{color:#737b88}.spacer{flex:1}
</style>
<main class="window compact" id="window"><header><strong>AI Usage <span class="muted">· ♡</span></strong><span class="badge">ข้อมูลตัวอย่าง</span><button id="pin" aria-label="ปักหน้าต่าง" aria-pressed="false">📌</button><button id="close" aria-label="ปิดโปรแกรม">×</button></header>
<p class="note">ต้นแบบหน้าต่าง Windows · รูปแบรนด์และมาสคอตเป็นภาพร่าง</p>
<nav><button id="compact" aria-pressed="true">Compact</button><button id="detail" aria-pressed="false">Detail</button><span class="spacer"></span><button id="used" aria-pressed="true">ใช้แล้ว</button><button id="remaining" aria-pressed="false">เหลือ</button></nav>
<div id="cards" class="cards"></div>
<footer><label>อัปเดตทุก <input id="interval" type="number" min="1" value="5" aria-label="ช่วงเวลาอัปเดตเป็นนาที"> นาที</label><button id="refresh">↻ รีเฟรช</button><button id="add">+ เพิ่มบัญชี</button><span>ตั้งเวลาในต้นแบบเท่านั้น</span></footer><div id="notice" role="status"></div></main>
<script>
const examples=[{provider:'Codex',email:'work@example.com',channels:['เว็บ','CLI'],quotas:[['5h',28,'อีก 2 ชม. 10 นาที'],['Weekly',62,'อีก 3 วัน']]},{provider:'Claude',email:'personal@example.com',channels:['เว็บ','CLI'],quotas:[['5h',55,'อีก 48 นาที'],['Weekly',39,'อีก 4 วัน'],['Fable',18,'รอตรวจสอบรอบรีเซ็ตจริง']]},{provider:'Claude',email:'team@example.com',channels:['เว็บ'],quotas:null}];
let remaining=false;
function render(){document.querySelector('#cards').innerHTML=examples.map((a,i)=>`<article class="card ${a.provider==='Claude'?'claude':''}"><div class="account"><span class="brand" title="ภาพแทนโลโก้แบรนด์">${a.provider==='Claude'?'C':'O'}</span><div class="identity"><b>${a.provider}</b><small>${a.email}</small><small>เชื่อมต่อ: ${a.channels.join(' · ')} · ตัวอย่าง</small></div><span class="mascot" title="มาสคอตภาพร่าง">•ᴗ•</span></div>${a.quotas?`<div class="quotas">${a.quotas.map((q,j)=>`<div><div class="quota-top"><span>${q[0]}</span><b class="percentage">${remaining?100-q[1]:q[1]}% ${remaining?'เหลือ':'ใช้แล้ว'}</b></div><div class="track"><div class="fill" style="width:${remaining?100-q[1]:q[1]}%"></div></div><div class="reset">รีเซ็ต: ${q[2]} · ตัวอย่าง</div><div class="details"><label>เตือนเมื่อใช้ถึง <input class="threshold" type="number" min="1" max="100" value="${settings['threshold-'+i+'-'+j]||80}" data-key="threshold-${i}-${j}" aria-label="เกณฑ์เตือน ${a.email} ${q[0]}"> %</label><label><input class="reset-alert" type="checkbox" data-key="reset-${i}-${j}" ${settings['reset-'+i+'-'+j]===false?'':'checked'}> เตือนเมื่อรีเซ็ต</label></div></div>`).join('')}</div>`:`<div class="error">อ่านข้อมูลไม่ได้ — รอเชื่อมต่อใหม่<br><button class="reconnect">เชื่อมต่อใหม่</button></div>`}<div class="details catalog">ผลิตภัณฑ์: ${a.provider} · รายชื่อโมเดลทั้งหมดรอตรวจสอบแหล่งข้อมูล${a.provider==='Claude'?'<br>Fable: ชื่อตามที่ผู้ใช้ระบุ ยังไม่ยืนยัน schema จริง':''}</div></article>`).join('');}
const settings={};render();
function notice(t){document.querySelector('#notice').textContent=t}
for(const mode of ['compact','detail'])document.getElementById(mode).onclick=()=>{document.querySelector('#window').classList.toggle('compact',mode==='compact');for(const m of ['compact','detail'])document.getElementById(m).setAttribute('aria-pressed',m===mode)};
for(const m of ['used','remaining'])document.getElementById(m).onclick=()=>{remaining=m==='remaining';for(const n of ['used','remaining'])document.getElementById(n).setAttribute('aria-pressed',m===n);render()};
document.querySelector('#cards').onchange=e=>{if(e.target.dataset.key)settings[e.target.dataset.key]=e.target.type==='checkbox'?e.target.checked:e.target.value};
document.querySelector('#cards').onclick=e=>{if(e.target.classList.contains('reconnect'))notice('ต้นแบบเท่านั้น: ยังไม่มีระบบเชื่อมต่อบัญชีจริง')};
document.querySelector('#pin').onclick=()=>notice('ต้นแบบบนเว็บยังปักหน้าต่าง Windows ไม่ได้; โปรแกรมจริงจะมีเปิด–ปิด');
document.querySelector('#close').onclick=()=>notice('ต้นแบบเท่านั้น: โปรแกรมจริงจะออกทันทีและหยุดอัปเดต/แจ้งเตือน');
document.querySelector('#refresh').onclick=()=>notice('ข้อมูลตัวอย่างคงที่ — ยังไม่มีการเรียก usage จริง');
document.querySelector('#add').onclick=()=>notice('Sign in รอตรวจสอบวิธีที่บริการรองรับ — ต้นแบบไม่รับรหัสผ่าน');
</script></html>
