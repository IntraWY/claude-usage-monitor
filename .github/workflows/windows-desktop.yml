name: Windows desktop
on:
  push:
    branches: [master]
    paths: ["desktop-app/**", "lib/**", "extensions/usage-monitor/**", ".github/workflows/windows-desktop.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run portable:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Usage-Monitor-Windows
          path: desktop-app/dist/*.exe
